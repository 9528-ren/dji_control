[Dev Info]
# Pilot 2 中显示的负载名称
product_alias=M3_GIMBAL_V3;
serial_number=M3WGTGIMBAL0003;

[Gimbal Info]
# 云台挂载位置: 1-主云台(E1)
gimbal_mount_pos=1;
# 每次按键俯仰转动角度(度)
pitch_step=10;
# 每次转动耗时(秒)
rotate_time=1;

[Flight Info]
# 固定目标点, 经纬度单位: 度(WGS84, 与 Pilot 地图一致)
# 0,0 表示未配置, 按"飞往目标"会被拒绝. 请换成实际目标点
target_latitude=0;
target_longitude=0;
# 目标点高度, 相对起飞点(m)
target_height=30;
# 最低航线高度, 相对起飞点(m). 起飞点附近有障碍物时调高
min_enroute_height=30;
# 飞行速度(m/s), 1~15
fly_speed=5;
# 目标点离当前位置的最大允许距离(m), 超过则拒绝执行, 防止坐标填错
max_fly_distance=500;
# 方向按键(前进/后退/左移/右移)每次平移距离(m)
move_distance=5;
# 降落到离地 0.7m 触发降落保护时, 是否自动确认降落
# false: 需在遥控器上手动确认; true: 自动确认(确保降落点平整无遮挡再开启)
auto_confirm_landing=false;

[Widget Info]
# 控件配置目录(相对程序运行目录)
widget_cfg_dir=widget_cfg;

[Track Info]
# 航迹文件存储目录(相对程序运行目录), 每条航迹一个 <名字>.trk 文件
track_dir=track;
# 采点与执行航迹要求的最小可见卫星数. 低于此值拒绝采点/拒绝执行
track_min_satellites=10;
# 单个航点飞行的基础超时(秒). 实际超时还会按段距自动放宽: max(本值, 段距/速度*2+30)
track_point_timeout_s=120;
# 到位判定容差(m). 实际偏差超过 3 倍此值则中止整条航迹, 仅超过 1 倍则告警继续
track_arrive_tolerance=2;
# 每个航点云台转到记录俯仰角的等待上限(ms). 超时只告警不中止
track_gimbal_settle_ms=3000;
# 椭球高交叉校验容差(m). 换算出的目标椭球高与采集时记录值偏差超过此值即中止,
# 用于捕获"换了起飞点/地形不同/RTK基准漂移"导致的撞地或超高
track_alt_crosscheck_m=10;
# 单条航迹最大航点数(硬上限由 TrackStore 强制为 200)
track_max_points=200;
# 是否额外要求负载自带网络RTK处于传输态(DJI_TRANSFER=2)才允许采点/执行.
# 默认 false: 若 RTK 源是遥控器或 D-RTK2 而非负载网络RTK, 该状态可能恒为非传输态,
# 置 true 会把飞机无理由锁在地面。RTK 解状态 50(NARROW_INT 固定解) 才是权威判据。
track_require_network_rtk=false;
# 执行途中 RTK 掉固定解时, 是否用最后一次可信坐标强制停住.
# 默认 false: 让当前段(目标点是固定解时采集的有效坐标)飞完并在该点自动悬停,
# 比用降级定位重新指定位置更安全
track_stop_on_rtk_loss=false;
